
name: PALETTE CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - feature/job-security-admin-export

permissions:
  contents: read

jobs:
  backend-validation:
    name: Backend syntax validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check server.js

      - name: Check backend JavaScript syntax
        run: |
          find src -type f -name "*.js" -print0 | xargs -0 -r -n1 node --check

  frontend-validation:
    name: Frontend lint and production build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build
